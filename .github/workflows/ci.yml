name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# Every job reads only. release.yml grants contents: write to its publish job
# alone.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a full commit SHA, with the release tag beside it.
jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # The cyrius.cyml pin, signature- and checksum-verified, into
        # ~/.cyrius/versions/<V>/{bin,lib} (see the script's header).
        run: bash scripts/ci-install-cyrius.sh

      - name: Verify toolchain
        run: cyrius --version

      - name: Resolve dependencies
        # Must run before any step that touches `include "lib/..."`
        # (fmt, lint, vet, build, test). `./lib/` is gitignored —
        # `cyrius deps` populates it from the version-pinned stdlib
        # snapshot + [deps.<name>] git pins. Matches yukti / agnosys /
        # agnostik convention.
        run: cyrius deps

      - name: Verify dep hashes
        # Skip on the first push that introduces a new dep before
        # cyrius.lock is generated and committed. Once present, enforce.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Lint
        # Auto-discover so new modules get linted without editing CI.
        # Treat any cyrlint "  warn " line as a failure.
        run: |
          fail=0
          for f in src/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr docs/examples/*.cyr; do
            [ -f "$f" ] || continue
            out=$(cyrius lint "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -qE '^\s*warn '; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        # `cyrius fmt <file> --check` sets the exit code (0 clean / 1 drift)
        # and leaves the file untouched. Plain `cyrius fmt <file>` rewrites the
        # file in place and prints nothing, so a `diff <(cyrius fmt f) f` gate
        # would report drift on every file and reformat the checkout under the
        # later steps.
        run: |
          fail=0
          for f in src/*.cyr tests/tcyr/*.tcyr tests/bcyr/*.bcyr docs/examples/*.cyr; do
            [ -f "$f" ] || continue
            if ! cyrius fmt "$f" --check > /dev/null 2>&1; then
              echo "needs fmt: $f"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Build (DCE)
        # --check-lib-sync turns the `./lib/ shadows version-pinned <path>`
        # warning into a hard error: a stale `deps.NAME` git pin must not
        # overlay an older copy of a stdlib-folded library on the toolchain
        # snapshot. `deps --verify` cannot see that, because the lock is
        # written from disk.
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build --check-lib-sync src/main.cyr build/argonaut
          echo "argonaut: $(wc -c < build/argonaut) bytes"

      - name: Verify ELF
        # od, not xxd: the Ubuntu 26.04 runner images do not ship xxd.
        run: test "$(head -c 4 build/argonaut | od -An -tx1 | tr -d ' \n')" = 7f454c46

      - name: Smoke test
        run: |
          ./build/argonaut | tee /tmp/smoke_output
          grep -q "all systems nominal" /tmp/smoke_output

      - name: Cross-build aarch64
        # Required. This is the binary the release ships as
        # argonaut-<VER>-aarch64-linux. The aarch64-native job builds the same
        # source with the native toolchain on arm64 hardware, requires the two
        # builds to be byte-identical, and runs every suite there.
        # Portability is in the source, not the compiler: every syscall goes
        # through a stdlib sys_* wrapper or src/syscall_compat.cyr (arch note 001).
        run: |
          CYRIUS_DCE=1 cyrius build --check-lib-sync --aarch64 src/main.cyr build/argonaut-aarch64
          echo "argonaut-aarch64: $(wc -c < build/argonaut-aarch64) bytes"
          file build/argonaut-aarch64 | grep -q "ARM aarch64" || {
            echo "ERROR: build/argonaut-aarch64 is not an aarch64 ELF"; exit 1; }
          test "$(head -c 4 build/argonaut-aarch64 | od -An -tx1 | tr -d ' \n')" = 7f454c46

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-x86_64
          path: build/argonaut
          retention-days: 5

      - name: Upload aarch64 build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-aarch64
          path: build/argonaut-aarch64
          retention-days: 5

      - name: Test (every tcyr suite)
        # Deliberately not gated on a suite or assertion count. A count in a
        # step name drifts silently, and an assertion floor gates the runner's
        # environment rather than the code (kybernet standing rule 33).
        # `fail -eq 0` already implies every discovered suite reached a clean
        # summary: each pass through the loop increments pass or fail. An
        # unmatched glob leaves the literal pattern as $t, cyrius fails on it,
        # and fail becomes 1, so the empty case is caught too (Actions does not
        # set nullglob). The real counts are printed on the summary line.
        run: |
          pass=0; fail=0; asserts=0
          for t in tests/tcyr/*.tcyr; do
            out=$(cyrius test "$t" 2>&1)
            sum=$(echo "$out" | grep -E "^[0-9]+ passed,")
            if echo "$sum" | grep -q "0 failed"; then
              pass=$((pass + 1))
              n=$(echo "$sum" | grep -oP "^\d+")
              asserts=$((asserts + n))
            else
              fail=$((fail + 1))
              echo "FAIL: $t"
              echo "$out" | grep -vE '^  dead:|^warning:|^note:' | tail -10
            fi
          done
          echo "suites: $pass pass, $fail fail | assertions: $asserts"
          test $fail -eq 0

      - name: Run the docs examples
        # Every docs/examples/*.cyr must still build and run against src/.
        run: |
          for f in docs/examples/*.cyr; do
            echo "== $f"
            cyrius run "$f"
          done

      - name: Bench
        # bash, not sh: the script needs pipefail, BASH_SOURCE and [[ ]], and
        # ubuntu's sh is dash. The numbers are recorded, not gated (a shared
        # runner is too noisy for the release gate's ±2 µs band). A bench that
        # fails to build, or a run that yields no rows, fails the step.
        run: |
          label="ci-${GITHUB_SHA::7}"
          bash scripts/bench-history.sh "$label"
          rows=$(grep -c ",${label}," bench-history.csv || true)
          echo "bench rows for $label: $rows"
          test "$rows" -gt 0

      - name: Upload bench history
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-history
          path: bench-history.csv
          retention-days: 90

  aarch64-native:
    name: aarch64 native (arm64 runner)
    needs: [build]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain (aarch64-linux)
        # On this runner the script installs the aarch64-linux tarball: a
        # native cycc and cyrius CLI, the toolchain an arm64 user runs.
        run: bash scripts/ci-install-cyrius.sh

      - name: Verify toolchain
        run: |
          cyrius --version
          file "$(readlink -f "$HOME/.cyrius/bin/cycc")" | grep -q "ARM aarch64"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Verify dep hashes
        run: cyrius deps --verify

      - name: Build (DCE, native)
        run: |
          mkdir -p build
          CYRIUS_DCE=1 cyrius build --check-lib-sync src/main.cyr build/argonaut
          echo "argonaut (native aarch64): $(wc -c < build/argonaut) bytes"
          file build/argonaut | grep -q "ARM aarch64" || {
            echo "ERROR: the native build is not an aarch64 ELF"; exit 1; }

      - name: Download the cross-built aarch64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-aarch64
          path: cross

      - name: Native and cross builds are byte-identical
        # The release ships the cross-built binary. This ties it to the bytes
        # the smoke test and the suites below run on arm64 hardware.
        run: cmp build/argonaut cross/argonaut-aarch64

      - name: Smoke test
        run: |
          ./build/argonaut | tee /tmp/smoke_output
          grep -q "all systems nominal" /tmp/smoke_output

      - name: Test (every tcyr suite, native)
        # The same loop as the build job. Suites that depend on a platform
        # behaviour (RLIMIT_AS, MSG_CTRUNC) probe it first, so on hardware they
        # assert what the kernel does, not what qemu-user does.
        run: |
          pass=0; fail=0; asserts=0
          for t in tests/tcyr/*.tcyr; do
            out=$(cyrius test "$t" 2>&1)
            sum=$(echo "$out" | grep -E "^[0-9]+ passed,")
            if echo "$sum" | grep -q "0 failed"; then
              pass=$((pass + 1))
              n=$(echo "$sum" | grep -oP "^\d+")
              asserts=$((asserts + n))
            else
              fail=$((fail + 1))
              echo "FAIL: $t"
              echo "$out" | grep -vE '^  dead:|^warning:|^note:' | tail -10
            fi
          done
          echo "suites: $pass pass, $fail fail | assertions: $asserts"
          test $fail -eq 0

  qemu-pid1:
    name: qemu PID-1 harness (KVM)
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the x86_64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-x86_64
          path: build

      - name: Prepare KVM, qemu and a kernel
        # The harness needs KVM and an invariant TSC: it boots with
        # `-cpu host,+invtsc`, and sakshi's clock init panics without one
        # (arch note 002). Where the runner lacks either, both steps below are
        # skipped with a warning on the run. Where both are present, a failure
        # is a real failure.
        id: prep
        timeout-minutes: 10
        run: |
          chmod +x build/argonaut
          # Newer than cyrius.cyml and l3-helper.cyr, so build-initramfs.sh
          # packs the tested binaries instead of rebuilding them (this job
          # installs no toolchain).
          touch build/argonaut qemu/helpers/l3-helper
          if [ ! -e /dev/kvm ]; then
            echo "::warning::/dev/kvm is absent on this runner: qemu PID-1 harness skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          [ -r /dev/kvm ] && [ -w /dev/kvm ] || {
            echo "::error::/dev/kvm exists but is not usable after the udev rule"; exit 1; }
          if ! grep -qw nonstop_tsc /proc/cpuinfo; then
            echo "::warning::the runner's CPU reports no invariant TSC (nonstop_tsc): qemu PID-1 harness skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sudo apt-get update -q
          # busybox for the harness's M3/L3 cases; bsdcpio (libarchive-tools)
          # packs the initramfs.
          sudo apt-get install -y -q --no-install-recommends \
            qemu-system-x86 busybox-static libarchive-tools
          # The runner's own kernel (/boot is root-only).
          sudo install -m 0644 "/boot/vmlinuz-$(uname -r)" "$RUNNER_TEMP/vmlinuz"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Boot test
        if: steps.prep.outputs.run == 'true'
        run: bash qemu/boot-test.sh "$RUNNER_TEMP/vmlinuz"

      - name: PID-1 harness (M3 + L3)
        if: steps.prep.outputs.run == 'true'
        run: bash qemu/pid1-harness-test.sh "$RUNNER_TEMP/vmlinuz"

  security:
    name: Security Scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan for dangerous patterns
        # Match code lines only — strip comments via awk, not "grep -v '# '"
        # (which would also eat any line with an inline comment).
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"
              echo "$hits"
              FAIL=1
            fi
          }
          # raw execve / fork outside process_mgmt
          hits=$(grep -rn 'syscall( *59' src/ 2>/dev/null | grep -v process_mgmt || true)
          [ -n "$hits" ] && { echo "FAIL: raw execve outside process_mgmt"; echo "$hits"; FAIL=1; }
          scan "shadow file access"  '"/etc/shadow"'
          scan "raw system()"        '\bsystem\s*('
          # Unbounded stack buffers (>= 64KB → require heap review)
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL

  docs:
    name: Documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check required files
        # The first-party documentation standard's root files and docs tree.
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md \
                   CODE_OF_CONDUCT.md LICENSE CLAUDE.md cyrius.cyml cyrius.lock \
                   docs/adrs/README.md docs/architecture/README.md \
                   docs/examples/README.md \
                   docs/development/roadmap.md docs/development/state.md; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        # The cyrius.cyml manifest pulls package.version from VERSION via
        # ${file:VERSION}; just check VERSION appears in CHANGELOG.
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
