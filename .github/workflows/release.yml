name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify
    # step below enforces semver shape + match against VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

# Read-only by default, the CI gate included. Only the publish job writes.
permissions:
  contents: read

# Actions are pinned to a full commit SHA, with the release tag beside it.
jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        # The cyrius.cyml pin, signature- and checksum-verified (see the
        # script's header).
        run: bash scripts/ci-install-cyrius.sh

      - name: Resolve deps
        run: cyrius deps

      - name: Verify dep hashes
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::cyrius.lock not committed — skipping hash verification"
          fi

      - name: Build (DCE)
        run: |
          mkdir -p build
          # --check-lib-sync: fail the release if ./lib/ has drifted from the
          # version-pinned snapshot (see ci.yml for the full rationale).
          CYRIUS_DCE=1 cyrius build --check-lib-sync src/main.cyr build/argonaut
          echo "argonaut: $(wc -c < build/argonaut) bytes"

      - name: Cross-build aarch64
        # Required: every release ships argonaut-<VER>-aarch64-linux.
        run: |
          CYRIUS_DCE=1 cyrius build --check-lib-sync --aarch64 src/main.cyr build/argonaut-aarch64
          echo "argonaut-aarch64: $(wc -c < build/argonaut-aarch64) bytes"
          file build/argonaut-aarch64 | grep -q "ARM aarch64" || {
            echo "ERROR: build/argonaut-aarch64 is not an aarch64 ELF"; exit 1; }

      - name: Download the binaries the CI gate tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: tested

      - name: Release binaries are the ones CI tested
        # The CI gate tested these bytes: x86_64 in its build and qemu jobs,
        # aarch64 on arm64 hardware. The rebuild from the tag must match both.
        run: |
          cmp build/argonaut tested/build-x86_64/argonaut
          cmp build/argonaut-aarch64 tested/build-aarch64/argonaut-aarch64
          echo "x86_64 and aarch64 release binaries match the CI gate's"

      - name: Test
        run: |
          pass=0; fail=0
          for t in tests/tcyr/*.tcyr; do
            out=$(cyrius test "$t" 2>&1)
            if echo "$out" | grep -E "^[0-9]+ passed," | grep -q "0 failed"; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1)); echo "FAIL: $t"
            fi
          done
          echo "$pass passed, $fail failed"
          test $fail -eq 0

      - name: Smoke test
        run: |
          ./build/argonaut | grep -q "all systems nominal"

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="argonaut-${TAG}/" -o "argonaut-${TAG}-src.tar.gz" HEAD
          cp build/argonaut "argonaut-${TAG}-x86_64-linux"
          cp build/argonaut-aarch64 "argonaut-${TAG}-aarch64-linux"
          sha256sum argonaut-*.tar.gz argonaut-*-linux > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            argonaut-*.tar.gz
            argonaut-*-linux
            cyrius.lock
            SHA256SUMS

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts

      - name: Extract changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          [ -s /tmp/body.md ] || echo "No changelog entry for $TAG." > /tmp/body.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "argonaut ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            argonaut-*.tar.gz
            argonaut-*-linux
            cyrius.lock
            SHA256SUMS
